[platformio]
default_envs = bry88ab

[env]
platform = espressif32@6.12.0
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
extra_scripts = pre:prepare.py
lib_deps = bblanchon/ArduinoJson@6.21.5
# Application, HomeSpan and rebuilt Arduino code use explicit error returns.
# Keep the precompiled SDK/toolchain's own exception support intact.
build_unflags = -fexceptions
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -fno-exceptions
  -fno-unwind-tables
  -fno-asynchronous-unwind-tables

[env:bry88ab]

[env:bry88ab-hub]
# Keep the stock OTA reserve with the complete shared management frontend.
# Only rebuilt code uses LTO; precompiled ESP-IDF libraries remain unchanged.
build_unflags = ${env.build_unflags} -fno-lto
build_flags = ${env.build_flags} -DIOTCLOUD_HUB=1 -flto -Wl,--relax,--size-opt
