<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>屏幕壁纸转换 / Screen wallpaper converter</title><meta name="description" content="在浏览器中将图片转换为 BRY88BBA15G 屏幕壁纸。Convert images locally for the BRY88BBA15G screen."><link rel="canonical" href="https://phicomm-io.github.io/tools/screen-wallpaper/"><link rel="stylesheet" href="../../style.css"><script src="../../theme.js"></script><style>
main{max-width:980px;margin:auto;padding:32px 20px}.converter{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,300px);gap:32px;margin-top:28px}.controls{display:flex;flex-direction:column;gap:18px}label{display:grid;gap:8px}button,a.btn,select,input{font:inherit}#preview{aspect-ratio:480/854;position:relative;background:#101611;border-radius:16px;overflow:hidden;isolation:isolate;container-type:inline-size}#image{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}#image:not([src]){visibility:hidden}#overlay{position:absolute;inset:0;background:#000;opacity:.24}.tile{position:absolute;left:6.667%;right:6.667%;border:1px solid #75816a66;border-radius:2.5cqw;background:#1b251dcc;color:#f0f3e8;padding:3.33cqw}.clock{top:12%;text-align:center;background:transparent;border:0}.clock b{font-size:25cqw;font-weight:400}.clock span{display:block;font-size:6cqw;color:#d9e5d0}.value{top:44%;height:22%}.value span{font-size:7cqw}.value small{float:right;font-size:5cqw}.value b{display:block;text-align:center;font-size:20cqw;font-weight:400}.note{color:var(--muted,#6b776f);line-height:1.7}#state{min-height:1.5em}.actions{display:flex;gap:12px;flex-wrap:wrap}#download[hidden]{display:none}a{color:inherit}@media(max-width:620px){.converter{grid-template-columns:1fr}#preview{width:min(100%,300px);justify-self:center}}
</style></head><body><main><nav class="actions"><a href="../../">PHICOMM COMMUNITY</a><label><span class="sr">Language / 语言</span><select id="language"><option value="zh">简体中文</option><option value="en">English</option></select></label></nav><h1 data-text="title">屏幕壁纸转换</h1><p class="note" data-text="intro">选择图片，预览后下载 .bwp，再到设备的「屏幕 → 外观」上传。图片仅在此浏览器处理。</p><div class="converter"><div class="controls"><label><b data-text="file">图片文件</b><input id="file" type="file" accept="image/png,image/jpeg,image/webp,.bwp"></label><p class="note" data-text="format">PNG、JPEG、WebP，最大 5 MB、2000 万像素。居中裁剪为 240 × 427 RGB565，屏幕显示为 480 × 854。</p><label><span data-text="dim">壁纸压暗预览</span><input id="dim" type="range" min="0" max="70" value="24"><output id="dimValue">24%</output></label><p class="note" data-text="settings">压暗与组件透明度由设备的外观设置控制，不写入图片。</p><div class="actions"><a class="btn primary" id="download" hidden data-text="download">下载 .bwp</a></div><p id="state" role="status" aria-live="polite"></p></div><div id="preview" aria-label="480 × 854"><img id="image" alt=""><div id="overlay"></div><div class="tile clock"><b>18:42</b><span>11 / 06</span></div><div class="tile value"><span>CO₂</span><small>ppm</small><b>628</b></div></div></div></main><script src="codec.js"></script><script src="app.js"></script></body></html>
