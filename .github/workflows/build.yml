name: Build community firmware

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tc1:
    name: TC1 firmware (A1 hardware variant)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 curl git perl python3 zlib1g-dev libncurses5 libtinfo5
      - uses: actions/cache@v4
        with:
          path: |
            build/tc1-tools
            build/tc1-sdk
          key: tc1-tools-ubuntu22-gcc54-python2718-${{ hashFiles('TC1/sdk.json') }}
      - name: Verify project version
        env:
          TAG_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python3 tools/check_version.py --tag "$TAG_NAME"
          else
            python3 tools/check_version.py
          fi
      - name: Build TC1 firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./TC1/build.sh
      - name: Prepare release assets
        run: |
          mkdir -p release
          cp build/tc1-release/phicomm_tc1_a1.ota.bin build/tc1-release/phicomm_tc1_a1.all.bin release/
          (cd release && sha256sum *.bin > SHA256SUMS-tc1)
      - uses: actions/upload-artifact@v4
        with:
          name: tc1-firmware
          path: release/
          if-no-files-found: error
          retention-days: 30

  m1:
    name: M1 firmware
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 curl git perl python3 zlib1g-dev libncurses5 libtinfo5
      - uses: actions/cache@v4
        with:
          path: build/m1-tools
          key: m1-tools-ubuntu22-gcc54-python2718-v1
      - name: Verify project version
        env:
          TAG_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python3 tools/check_version.py --tag "$TAG_NAME"
          else
            python3 tools/check_version.py
          fi
      - name: Build M1 firmware
        run: ./M1/build.sh
      - name: Prepare release assets
        run: |
          mkdir -p release
          cp build/m1-release/phicomm_m1.ota.bin build/m1-release/phicomm_m1.all.bin release/
          (cd release && sha256sum *.bin > SHA256SUMS-m1)
      - uses: actions/upload-artifact@v4
        with:
          name: m1-firmware
          path: release/
          if-no-files-found: error
          retention-days: 30

  a1:
    name: A1 firmware
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 curl git perl python3 zlib1g-dev libncurses5 libtinfo5
      - uses: actions/cache@v4
        with:
          path: build/a1-tools
          key: a1-tools-ubuntu22-gcc54-python2718-v1
      - name: Verify project version
        env:
          TAG_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python3 tools/check_version.py --tag "$TAG_NAME"
          else
            python3 tools/check_version.py
          fi
      - name: Build A1 firmware
        run: ./A1/build.sh
      - name: Prepare release assets
        run: |
          mkdir -p release
          cp build/a1-release/phicomm_a1.ota.bin build/a1-release/phicomm_a1.all.bin release/
          (cd release && sha256sum *.bin > SHA256SUMS-a1)
      - uses: actions/upload-artifact@v4
        with:
          name: a1-firmware
          path: release/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release all products
    needs: [tc1, m1, a1, feature-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-firmware'
          merge-multiple: true
          path: release
      - name: Publish all products
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          assets=(
            release/phicomm_tc1_a1.ota.bin release/phicomm_tc1_a1.all.bin
            release/phicomm_m1.ota.bin release/phicomm_m1.all.bin
            release/phicomm_a1.ota.bin release/phicomm_a1.all.bin
          )
          for name in "${assets[@]}"; do
            test -s "$name"
          done
          cat release/SHA256SUMS-tc1 release/SHA256SUMS-m1 release/SHA256SUMS-a1 > release/SHA256SUMS
          (cd release && sha256sum -c SHA256SUMS)
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" release/SHA256SUMS --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" release/SHA256SUMS --title "$TAG_NAME" --generate-notes
          fi

  feature-tests:
    name: Binding and automation host scenarios
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned firmware JSON library
        uses: actions/checkout@v4
        with:
          repository: MXCHIP/mico-os
          ref: 6c465211d3ff8797cd835e400ec54a06530dd476
          path: build/a1-sdk/mico-os
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test engines, binding runtime and WebUI syntax
        run: tests/run.sh
      - name: Test WebUI configuration forms
        run: |
          npm install --prefix "$RUNNER_TEMP/phicomm-ui-tests" jsdom@30.1.2
          NODE_PATH="$RUNNER_TEMP/phicomm-ui-tests/node_modules" node tests/test_web.cjs
