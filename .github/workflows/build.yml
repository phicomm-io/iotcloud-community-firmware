name: Build community firmware

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tc1:
    name: TC1 firmware (A1 hardware variant)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 curl git perl python3 zlib1g-dev libncurses5 libtinfo5
      - uses: actions/cache@v4
        with:
          path: |
            build/tc1-tools
            build/tc1-sdk
          key: tc1-tools-ubuntu22-gcc54-python2718-${{ hashFiles('TC1/sdk.json', 'TC1/*.patch', 'common/mqtt-mico35.patch') }}
      - name: Verify project version
        env:
          TAG_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python3 tools/check_version.py --tag "$TAG_NAME"
          else
            python3 tools/check_version.py
          fi
      - name: Build TC1 firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./TC1/build.sh
      - name: Test TC1 protocol and HTTP regressions
        run: tests/run_tc1.sh
      - name: Prepare release assets
        run: |
          mkdir -p release
          cp build/tc1-release/phicomm_tc1_a1.ota.bin release/phicomm_tc1_a1.ota.bin.raw
          cp build/tc1-release/phicomm_tc1_a1.all.bin release/
          (cd release && sha256sum *.bin *.bin.raw > SHA256SUMS-tc1)
      - uses: actions/upload-artifact@v4
        with:
          name: tc1-firmware
          path: release/
          if-no-files-found: error
          retention-days: 30

  m1:
    name: M1 firmware
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 curl git perl python3 zlib1g-dev libncurses5 libtinfo5
      - uses: actions/cache@v4
        with:
          path: build/m1-tools
          key: m1-tools-ubuntu22-gcc54-python2718-v1
      - name: Verify project version
        env:
          TAG_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python3 tools/check_version.py --tag "$TAG_NAME"
          else
            python3 tools/check_version.py
          fi
      - name: Build M1 firmware
        run: ./M1/build.sh
      - name: Prepare release assets
        run: |
          mkdir -p release
          cp build/m1-release/phicomm_m1.ota.bin release/phicomm_m1.ota.bin.raw
          cp build/m1-release/phicomm_m1.all.bin release/
          (cd release && sha256sum *.bin *.bin.raw > SHA256SUMS-m1)
      - uses: actions/upload-artifact@v4
        with:
          name: m1-firmware
          path: release/
          if-no-files-found: error
          retention-days: 30

  a1:
    name: A1 firmware
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 curl git perl python3 zlib1g-dev libncurses5 libtinfo5
      - uses: actions/cache@v4
        with:
          path: build/a1-tools
          key: a1-tools-ubuntu22-gcc54-python2718-v1
      - name: Verify project version
        env:
          TAG_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python3 tools/check_version.py --tag "$TAG_NAME"
          else
            python3 tools/check_version.py
          fi
      - name: Build A1 firmware
        run: ./A1/build.sh
      - name: Prepare release assets
        run: |
          mkdir -p release
          cp build/a1-release/phicomm_a1.ota.bin release/phicomm_a1.ota.bin.raw
          cp build/a1-release/phicomm_a1.all.bin release/
          (cd release && sha256sum *.bin *.bin.raw > SHA256SUMS-a1)
      - uses: actions/upload-artifact@v4
        with:
          name: a1-firmware
          path: release/
          if-no-files-found: error
          retention-days: 30

  sign-ota:
    name: Sign production OTA packages
    needs: [tc1, m1, a1, feature-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    environment: signed-ota-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify approved release source
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 tools/check_version.py --tag "$TAG_NAME"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-firmware'
          merge-multiple: true
          path: release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography==46.0.3
      - name: Sign and verify production packages
        env:
          OTA_KEY: ${{ secrets.OTA_SIGNING_KEY_PEM }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          test -n "$OTA_KEY"
          umask 077
          key_file="$RUNNER_TEMP/phicomm-ota-key.pem"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$OTA_KEY" > "$key_file"
          unset OTA_KEY
          for model in tc1 m1 a1; do
            product="$model"
            if [ "$model" = tc1 ]; then product=tc1_a1; fi
            python3 tools/ota/package.py --key "$key_file" --model "$model" \
              --version "$TAG_NAME" --commit "$(git rev-parse HEAD)" \
              "release/phicomm_$product.ota.bin.raw" "release/phicomm_$product.ota.bin.signed"
          done
          (cd release && sha256sum *.bin *.bin.raw *.bin.signed > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: release/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release all products
    needs: [sign-ota]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-release
          path: release
      - name: Publish all products
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          assets=(
            release/phicomm_tc1_a1.ota.bin.raw release/phicomm_tc1_a1.all.bin release/phicomm_tc1_a1.ota.bin.signed
            release/phicomm_m1.ota.bin.raw release/phicomm_m1.all.bin release/phicomm_m1.ota.bin.signed
            release/phicomm_a1.ota.bin.raw release/phicomm_a1.all.bin release/phicomm_a1.ota.bin.signed
          )
          for name in "${assets[@]}"; do
            test -s "$name"
          done
          (cd release && sha256sum -c SHA256SUMS)
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" release/SHA256SUMS --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" release/SHA256SUMS --title "$TAG_NAME" --generate-notes
          fi

  feature-tests:
    name: Binding and automation host scenarios
    needs: [tc1, m1, a1]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout pinned firmware JSON library
        uses: actions/checkout@v4
        with:
          repository: MXCHIP/mico-os
          ref: 6c465211d3ff8797cd835e400ec54a06530dd476
          path: build/a1-sdk/mico-os
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: tc1-firmware
          path: release
      - name: Test signed OTA vectors and Flash faults
        env:
          TC1_TEST_IMAGE: release/phicomm_tc1_a1.ota.bin.raw
        run: |
          python3 -m pip install cryptography==46.0.3
          test -s "$TC1_TEST_IMAGE"
          tests/ota/run.sh
      - name: Test engines, binding runtime and WebUI syntax
        run: tests/run.sh
      - name: Test WebUI configuration forms
        run: |
          npm install --prefix "$RUNNER_TEMP/phicomm-ui-tests" jsdom@30.1.2
          NODE_PATH="$RUNNER_TEMP/phicomm-ui-tests/node_modules" node tests/test_web.cjs
          NODE_PATH="$RUNNER_TEMP/phicomm-ui-tests/node_modules" node tests/test_tc1_web.cjs
