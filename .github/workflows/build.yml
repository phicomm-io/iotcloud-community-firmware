name: Build community firmware

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON2_VERSION: 2.7.18
  ARM_GCC_URL: https://launchpad.net/gcc-arm-embedded/5.0/5-2016-q2-update/+download/gcc-arm-none-eabi-5_4-2016q2-20160622-linux.tar.bz2
  MICO_CUBE_URL: https://files.pythonhosted.org/packages/a8/4e/687a3ef2edabfd9fdd797747d6eeb2ddbe70e65c49fa4062268281a0ded4/mico-cube-1.0.0.tar.gz
  MICODER_DIR: ${{ github.workspace }}/mico-os/MiCoder
  TOOLCHAIN_DIR: ${{ github.workspace }}/mico-os/MiCoder/compiler/arm-none-eabi-5_4-2016q2-20160622/Linux64
  BUILD_TARGET: TC1@MK3031@moc

jobs:
  tc1:
    name: TC1 firmware (A1 hardware variant)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            bzip2 \
            ca-certificates \
            coreutils \
            curl \
            file \
            libbz2-dev \
            libffi-dev \
            liblzma-dev \
            libncurses-dev \
            libncurses5 \
            libreadline-dev \
            libsqlite3-dev \
            libssl-dev \
            libtinfo5 \
            make \
            perl \
            tar \
            zlib1g-dev

      - name: Cache Python 2
        id: cache-python2
        uses: actions/cache@v4
        with:
          path: ~/.local/python-${{ env.PYTHON2_VERSION }}
          key: python-${{ runner.os }}-${{ runner.arch }}-${{ env.PYTHON2_VERSION }}

      - name: Build Python 2
        if: steps.cache-python2.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://www.python.org/ftp/python/${PYTHON2_VERSION}/Python-${PYTHON2_VERSION}.tgz" -o python2.tgz
          tar -xzf python2.tgz
          cd "Python-${PYTHON2_VERSION}"
          ./configure --prefix="${HOME}/.local/python-${PYTHON2_VERSION}" --enable-shared
          make -j"$(nproc)"
          make install

      - name: Export Python 2
        run: |
          echo "${HOME}/.local/python-${PYTHON2_VERSION}/bin" >> "${GITHUB_PATH}"
          echo "LD_LIBRARY_PATH=${HOME}/.local/python-${PYTHON2_VERSION}/lib:${LD_LIBRARY_PATH}" >> "${GITHUB_ENV}"
          echo "PYTHON2=${HOME}/.local/python-${PYTHON2_VERSION}/bin/python2.7" >> "${GITHUB_ENV}"

      - name: Cache Arm GCC
        id: cache-arm-gcc
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLCHAIN_DIR }}
          key: arm-gcc-${{ runner.os }}-${{ runner.arch }}-5_4-2016q2-20160622

      - name: Download Arm GCC
        if: steps.cache-arm-gcc.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 "${ARM_GCC_URL}" -o arm-gcc.tar.bz2
          mkdir -p arm-gcc-unpacked "${TOOLCHAIN_DIR}"
          tar -xjf arm-gcc.tar.bz2 -C arm-gcc-unpacked
          src_dir="$(find arm-gcc-unpacked -maxdepth 1 -type d -name 'gcc-arm-none-eabi-*' -print -quit)"
          if [ -z "${src_dir}" ]; then
            echo "Arm GCC directory was not found in downloaded archive." >&2
            find arm-gcc-unpacked -maxdepth 2 -type d | sort >&2
            exit 1
          fi
          cp -a "${src_dir}/." "${TOOLCHAIN_DIR}/"

      - name: Prepare MiCoder Linux layout
        run: |
          mkdir -p "${MICODER_DIR}/cmd/Linux64"
          ln -sf /bin/cat "${MICODER_DIR}/cmd/Linux64/cat"
          ln -sf /bin/cp "${MICODER_DIR}/cmd/Linux64/cp"
          ln -sf /bin/echo "${MICODER_DIR}/cmd/Linux64/echo"
          ln -sf /bin/mkdir "${MICODER_DIR}/cmd/Linux64/mkdir"
          ln -sf /bin/mv "${MICODER_DIR}/cmd/Linux64/mv"
          ln -sf /bin/rm "${MICODER_DIR}/cmd/Linux64/rm"
          ln -sf /bin/dash "${MICODER_DIR}/cmd/Linux64/dash"
          ln -sf /usr/bin/make "${MICODER_DIR}/cmd/Linux64/make"
          "${PYTHON2}" --version
          "${TOOLCHAIN_DIR}/bin/arm-none-eabi-gcc" --version

      - name: Prepare mico-cube
        run: |
          curl -fsSL "${MICO_CUBE_URL}" -o mico-cube.tar.gz
          tar -xzf mico-cube.tar.gz
          "${PYTHON2}" mico-cube-1.0.0/mico/mico.py --version
          "${PYTHON2}" mico-cube-1.0.0/mico/mico.py config --global MICODER "${MICODER_DIR}"
          "${PYTHON2}" mico-cube-1.0.0/mico/mico.py config --list

      - name: Generate web assets
        working-directory: TC1/http_server
        run: |
          "${PYTHON2}" ./test.py

      - name: Set firmware version from git tag
        if: github.ref_type == 'tag'
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          firmware_version="${TAG_NAME#v}"
          sed -i -E "s/^#define VERSION \".*\"/#define VERSION \"${firmware_version}\"/" TC1/main.h
          grep '^#define VERSION ' TC1/main.h

      - name: Build firmware
        run: |
          "${MICODER_DIR}/cmd/Linux64/make" \
            HOST_OS=Linux64 \
            TOOLS_ROOT="${MICODER_DIR}" \
            PYTHON="${PYTHON2}" \
            TLS=mocSSL \
            -f mico-os/makefiles/Makefile \
            "${BUILD_TARGET}" total

      - name: Publish firmware to release directory
        run: |
          binary_dir="build/${BUILD_TARGET}/binary"
          mkdir -p release
          cp "${binary_dir}/${BUILD_TARGET}.ota.bin" release/phicomm_tc1_a1.ota.bin
          cp "${binary_dir}/${BUILD_TARGET}.all.bin" release/phicomm_tc1_a1.all.bin
          (cd release && sha256sum *.bin > SHA256SUMS-tc1)

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tc1-firmware
          path: release/
          if-no-files-found: error
          retention-days: 30

  m1:
    name: M1 firmware
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 curl git perl python3 zlib1g-dev libncurses5 libtinfo5
      - uses: actions/cache@v4
        with:
          path: build/m1-tools
          key: m1-tools-ubuntu22-gcc54-python2718-v1
      - name: Set firmware version from git tag
        if: github.ref_type == 'tag'
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          firmware_version="${TAG_NAME#v}"
          sed -i -E "s/^#define (M1_VERSION|FIRMWARE_REVISION) \".*\"/#define \1 \"${firmware_version}\"/" M1/m1.h M1/mico_config.h
      - name: Build M1 firmware
        run: ./M1/build.sh
      - name: Prepare release assets
        run: |
          mkdir -p release
          cp build/m1-release/phicomm_m1.ota.bin build/m1-release/phicomm_m1.all.bin release/
          (cd release && sha256sum *.bin > SHA256SUMS-m1)
      - uses: actions/upload-artifact@v4
        with:
          name: m1-firmware
          path: release/
          if-no-files-found: error
          retention-days: 30

  a1:
    name: A1 firmware
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 curl git perl python3 zlib1g-dev libncurses5 libtinfo5
      - uses: actions/cache@v4
        with:
          path: build/a1-tools
          key: a1-tools-ubuntu22-gcc54-python2718-v1
      - name: Set firmware version from git tag
        if: github.ref_type == 'tag'
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          firmware_version="${TAG_NAME#v}"
          sed -i -E "s/^#define (A1_VERSION|FIRMWARE_REVISION) \".*\"/#define \1 \"${firmware_version}\"/" A1/a1.h A1/mico_config.h
      - name: Build A1 firmware
        run: ./A1/build.sh
      - name: Prepare release assets
        run: |
          mkdir -p release
          cp build/a1-release/phicomm_a1.ota.bin build/a1-release/phicomm_a1.all.bin release/
          (cd release && sha256sum *.bin > SHA256SUMS-a1)
      - uses: actions/upload-artifact@v4
        with:
          name: a1-firmware
          path: release/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release all products
    needs: [tc1, m1, a1]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-firmware'
          merge-multiple: true
          path: release
      - name: Publish all products
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          assets=(
            release/phicomm_tc1_a1.ota.bin release/phicomm_tc1_a1.all.bin
            release/phicomm_m1.ota.bin release/phicomm_m1.all.bin
            release/phicomm_a1.ota.bin release/phicomm_a1.all.bin
          )
          for name in "${assets[@]}"; do
            test -s "$name"
          done
          cat release/SHA256SUMS-tc1 release/SHA256SUMS-m1 release/SHA256SUMS-a1 > release/SHA256SUMS
          (cd release && sha256sum -c SHA256SUMS)
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" release/SHA256SUMS --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" release/SHA256SUMS --title "$TAG_NAME" --generate-notes
          fi
