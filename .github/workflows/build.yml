name: Build community firmware

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PHICOMM_OTA_CN_BASE_URL: http://phicomm.fjrcn.cn
  PHICOMM_OTA_GLOBAL_BASE_URL: http://phicomm.fjrcn.com

jobs:
  tc1:
    name: TC1 firmware (A1 hardware variant)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 curl git perl python3 zlib1g-dev libncurses5 libtinfo5
      - uses: actions/cache@v4
        with:
          path: |
            build/tc1-tools
            build/tc1-sdk
          key: tc1-tools-ubuntu22-gcc54-python2718-${{ hashFiles('TC1/sdk.json', 'TC1/*.patch', 'common/mqtt-mico35.patch') }}
      - name: Verify project version
        env:
          TAG_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python3 tools/check_version.py --tag "$TAG_NAME"
          else
            python3 tools/check_version.py
          fi
      - name: Build TC1 firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./TC1/build.sh
      - name: Test TC1 protocol and HTTP regressions
        run: tests/run_tc1.sh
      - name: Prepare release assets
        run: |
          mkdir -p release
          cp build/tc1-release/phicomm_tc1_a1.ota.bin release/phicomm_tc1_a1.ota.bin.raw
          cp build/tc1-release/phicomm_tc1_a1.all.bin release/
          (cd release && sha256sum *.bin *.bin.raw > SHA256SUMS-tc1)
      - uses: actions/upload-artifact@v4
        with:
          name: tc1-firmware
          path: release/
          if-no-files-found: error
          retention-days: 30

  m1:
    name: M1 firmware
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 curl git perl python3 zlib1g-dev libncurses5 libtinfo5
      - uses: actions/cache@v4
        with:
          path: build/m1-tools
          key: m1-tools-ubuntu22-gcc54-python2718-v1
      - name: Verify project version
        env:
          TAG_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python3 tools/check_version.py --tag "$TAG_NAME"
          else
            python3 tools/check_version.py
          fi
      - name: Build M1 firmware
        run: ./M1/build.sh
      - name: Prepare release assets
        run: |
          mkdir -p release
          cp build/m1-release/phicomm_m1.ota.bin release/phicomm_m1.ota.bin.raw
          cp build/m1-release/phicomm_m1.all.bin release/
          (cd release && sha256sum *.bin *.bin.raw > SHA256SUMS-m1)
      - uses: actions/upload-artifact@v4
        with:
          name: m1-firmware
          path: release/
          if-no-files-found: error
          retention-days: 30

  a1:
    name: A1 firmware
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 curl git perl python3 zlib1g-dev libncurses5 libtinfo5
      - uses: actions/cache@v4
        with:
          path: build/a1-tools
          key: a1-tools-ubuntu22-gcc54-python2718-v1
      - name: Verify project version
        env:
          TAG_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python3 tools/check_version.py --tag "$TAG_NAME"
          else
            python3 tools/check_version.py
          fi
      - name: Build A1 firmware
        run: ./A1/build.sh
      - name: Prepare release assets
        run: |
          mkdir -p release
          cp build/a1-release/phicomm_a1.ota.bin release/phicomm_a1.ota.bin.raw
          cp build/a1-release/phicomm_a1.all.bin release/
          (cd release && sha256sum *.bin *.bin.raw > SHA256SUMS-a1)
      - uses: actions/upload-artifact@v4
        with:
          name: a1-firmware
          path: release/
          if-no-files-found: error
          retention-days: 30

  sign-ota:
    name: Sign production OTA packages
    needs: [tc1, m1, a1, feature-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    environment: signed-ota-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify approved release source
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 tools/check_version.py --tag "$TAG_NAME"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-firmware'
          merge-multiple: true
          path: release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography==46.0.3
      - name: Sign and verify production packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OTA_KEY: ${{ secrets.OTA_SIGNING_KEY_PEM }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          test -n "$OTA_KEY"
          umask 077
          key_file="$RUNNER_TEMP/phicomm-ota-key.pem"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$OTA_KEY" > "$key_file"
          unset OTA_KEY
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release download "$TAG_NAME" --pattern "*.signed" --dir previous
          fi
          for model in tc1 m1 a1; do
            product="$model"
            if [ "$model" = tc1 ]; then product=tc1_a1; fi
            if test -s "previous/phicomm_$product.ota.bin.signed"; then
              cp "previous/phicomm_$product.ota.bin.signed" release/
              tail -c +193 "release/phicomm_$product.ota.bin.signed" | cmp - "release/phicomm_$product.ota.bin.raw"
            else
              python3 tools/ota/package.py --key "$key_file" --model "$model" \
                --version "$TAG_NAME" --commit "$(git rev-parse HEAD)" \
                "release/phicomm_$product.ota.bin.raw" "release/phicomm_$product.ota.bin.signed"
            fi
            python3 tools/release/verify.py "release/phicomm_$product.ota.bin.signed" "$model" "$TAG_NAME" "$(git rev-parse HEAD)"
          done
          (cd release && sha256sum *.bin *.bin.raw *.bin.signed > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: release/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish OTA and Pages
    needs: [sign-ota]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    environment: signed-ota-production
    concurrency:
      group: production-ota-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: signed-release
          path: release
      - run: pip install cryptography==46.0.3
      - name: Extract frozen Wiki release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 tools/release/notes.py "$TAG_NAME" --output release-notes.md
          python3 tools/release/catalog.py "$TAG_NAME" "$GITHUB_SHA" release release-notes.md
          (cd release && sha256sum -c SHA256SUMS)
      - name: Stage GitHub release and immutable OTA assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --draft --title "$TAG_NAME" --notes-file release-notes.md release/*
          else
            gh release download "$TAG_NAME" --dir existing
            for file in release/*.bin* release/SHA256SUMS; do cmp "$file" "existing/$(basename "$file")"; done
          fi
          python3 tools/release/deploy_worker.py
          python3 tools/release/publish.py release
          gh release edit "$TAG_NAME" --draft=false --latest
          python3 tools/release/publish.py release --promote
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and publish public Pages allowlist
        env:
          GH_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: tools/release/pages.sh

  feature-tests:
    env:
      PHICOMM_OTA_CN_BASE_URL: ""
      PHICOMM_OTA_GLOBAL_BASE_URL: ""
    name: Binding and automation host scenarios
    needs: [tc1, m1, a1]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout pinned firmware JSON library
        uses: actions/checkout@v4
        with:
          repository: MXCHIP/mico-os
          ref: 6c465211d3ff8797cd835e400ec54a06530dd476
          path: build/a1-sdk/mico-os
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: tc1-firmware
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: a1-firmware
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: m1-firmware
          path: release
      - name: Test signed OTA vectors and Flash faults
        env:
          TC1_TEST_IMAGE: release/phicomm_tc1_a1.ota.bin.raw
          A1_TEST_IMAGE: release/phicomm_a1.ota.bin.raw
          M1_TEST_IMAGE: release/phicomm_m1.ota.bin.raw
        run: |
          python3 -m pip install cryptography==46.0.3
          test -s "$TC1_TEST_IMAGE"
          test -s "$A1_TEST_IMAGE"
          test -s "$M1_TEST_IMAGE"
          tests/ota/run.sh
      - name: Test OTA release tooling and Worker
        run: |
          python3 -m unittest discover -s tests -p test_release.py
          node --test tests/test_ota_worker.mjs
      - name: Test production TLS transport with real TLS and sanitizers
        run: |
          curl -fsSL --retry 3 https://bearssl.org/bearssl-0.6.tar.gz -o "$RUNNER_TEMP/bearssl.tar.gz"
          echo "6705bba1714961b41a728dfc5debbe348d2966c117649392f8c8139efc83ff14  $RUNNER_TEMP/bearssl.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/bearssl.tar.gz" -C "$RUNNER_TEMP"
          OTA_BEARSSL_DIR="$RUNNER_TEMP/bearssl-0.6" python3 tests/test_ota_fetch.py
      - name: Test engines, binding runtime and WebUI syntax
        run: |
          python3 -m pip install Markdown==3.7
          tests/run.sh
      - name: Prepare pinned SDKs for MQTT transport tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/m1-sdk
          cp -a build/a1-sdk/mico-os build/m1-sdk/mico-os
          python3 TC1/tools/prepare_sdk.py build/tc1-sdk/mico-os
          python3 tools/apply_sdk_patch.py build/m1-sdk/mico-os common/mqtt-mico36.patch
          python3 tools/apply_sdk_patch.py build/m1-sdk/mico-os M1/mqtt-packet-deadline.patch
          python3 tools/apply_sdk_patch.py build/m1-sdk/mico-os common/mqtt-response-deadline.patch
          python3 tools/apply_sdk_patch.py build/a1-sdk/mico-os common/mqtt-mico36.patch
          python3 tools/apply_sdk_patch.py build/a1-sdk/mico-os M1/mqtt-packet-deadline.patch
          python3 tools/apply_sdk_patch.py build/a1-sdk/mico-os common/mqtt-response-deadline.patch
          python3 tools/apply_sdk_patch.py build/tc1-sdk/mico-os common/mqtt-mico35.patch
          python3 tools/apply_sdk_patch.py build/tc1-sdk/mico-os TC1/mqtt-packet-deadline.patch
      - name: Test TMCP using real SDK workers and an isolated broker
        run: |
          python3 -m pip install paho-mqtt==2.1.0 Jinja2==3.1.6
          tests/build_host.sh
          tests/run_mqtt_v2.sh
