name: Build community firmware

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'hotfix/**'
    tags:
      - 'v*'
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Sign and validate release artifacts without publishing (main only)
        type: boolean
        default: false
      validation_run_id:
        description: Exact successful main push run for heavy tests (tag only; invalid evidence fails)
        type: string
        default: ''
      runner:
        description: Runner for build, tests, signing and publication
        required: true
        type: choice
        default: auto
        options:
          - auto
          - github-hosted
          - self-hosted

permissions:
  contents: read

env:
  PHICOMM_OTA_CN_BASE_URL: http://phicomm.fjrcn.cn
  PHICOMM_OTA_GLOBAL_BASE_URL: http://phicomm.fjrcn.com

jobs:
  frontend:
    name: Verify locked frontend dependency
    permissions:
      contents: read
      actions: read
    outputs:
      reuse-heavy-validation: ${{ steps.validation.outputs.reuse }}
      validation-run-id: ${{ steps.validation.outputs.run-id }}
    # Use the same trusted-runner policy as firmware. This job never publishes
    # a frontend release or changes the committed lock.
    runs-on: >-
      ${{ fromJSON(
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
        ((github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted') ||
         (vars.PHICOMM_CI_RUNNER == 'self-hosted' &&
          (github.event_name != 'workflow_dispatch' || inputs.runner == 'auto'))) &&
        '["self-hosted","linux","x64","phicomm-build"]' || '["ubuntu-22.04"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check branch workflow
        run: python3 tools/check_branch_policy.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test locked dependency validation
        run: python3 -m unittest tests.test_frontend_dependency tests.test_ci_validation_reuse
      - name: Read exact protocol dependency
        id: protocol-pin
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          sys.path.insert(0, 'tools/ci')
          from validation_reuse import fingerprint
          print('commit=' + fingerprint()['protocols_commit'])
          PY
      - uses: actions/checkout@v4
        with:
          repository: phicomm-io/iotcloud-community-protocols
          ref: ${{ steps.protocol-pin.outputs.commit }}
          path: build/ci-protocols
          persist-credentials: false
      - name: Validate pinned protocol contracts
        run: |
          python3 -m pip install jsonschema==4.25.1
          python3 build/ci-protocols/tools/validate.py --consumer .
      - name: Prepare exact frontend archive
        env:
          # Main/tag builds and fork PRs always require the published release.
          ALLOW_CANDIDATE_SOURCE: >-
            ${{ github.ref_type != 'tag' &&
                ((github.event_name == 'pull_request' &&
                  github.event.pull_request.head.repo.full_name == github.repository) ||
                 (github.event_name == 'workflow_dispatch' && github.ref_name != 'main')) }}
        run: |
          args=()
          if [ "$ALLOW_CANDIDATE_SOURCE" = true ]; then args+=(--allow-candidate-source); fi
          python3 tools/ci/prepare_frontend.py \
            --output build/ci-frontend/frontend.tar.gz "${args[@]}"
      - name: Find exact-source main validation evidence
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_VALIDATION_RUN: ${{ inputs.validation_run_id }}
        run: python3 tools/ci/validation_reuse.py resolve --output build/ci-frontend/validation-reuse.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-frontend
          path: build/ci-frontend/
          if-no-files-found: error
          retention-days: 30

  firmware:
    name: ${{ matrix.model }} firmware variants
    needs: [frontend]
    strategy:
      fail-fast: false
      matrix:
        model: [tc1, m1, a1]
    env:
      TC1_TOOLS_DIR: ${{ github.workspace }}/build/ci-tools
      M1_TOOLS_DIR: ${{ github.workspace }}/build/ci-tools
      A1_TOOLS_DIR: ${{ github.workspace }}/build/ci-tools
      ARM_CC: ${{ github.workspace }}/build/ci-tools/gcc-arm-none-eabi-5_4-2016q2/bin/arm-none-eabi-gcc
      PHICOMM_FRONTEND_ARCHIVE: ${{ github.workspace }}/build/ci-frontend/frontend.tar.gz
    runs-on: >-
      ${{ fromJSON(
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
        ((github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted') ||
         (vars.PHICOMM_CI_RUNNER == 'self-hosted' &&
          (github.event_name != 'workflow_dispatch' || inputs.runner == 'auto'))) &&
        '["self-hosted","linux","x64","phicomm-build"]' || '["ubuntu-22.04"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: verified-frontend
          path: build/ci-frontend/
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 curl git perl python3 zlib1g-dev libncurses5 libtinfo5 libc6-i386 qemu-user
          python3 -m pip install -r requirements-build.txt
      - name: Identify tool cache location
        id: tool-path
        run: echo "key=$(printf '%s' "$GITHUB_WORKSPACE" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: build/mico-upstream.git
          key: mico-bare-${{ hashFiles('common/mico-sdk.json') }}
      - uses: actions/cache@v4
        with:
          path: |
            build/ci-tools/gcc-arm-none-eabi-5_4-2016q2
            build/ci-tools/python2
          key: ci-tools-ubuntu22-${{ runner.arch }}-gcc541-python2718-v1-${{ steps.tool-path.outputs.key }}
      - name: Validate restored tools and project version
        id: prep
        env:
          TAG_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          bash tools/ci/check_cached_tools.sh
          if [ "$REF_TYPE" = tag ]; then
            python3 tools/check_version.py --tag "$TAG_NAME"
          else
            python3 tools/check_version.py
          fi
      - name: Build full firmware
        id: full
        env:
          MODEL: ${{ matrix.model }}
          PHICOMM_FIRMWARE_VARIANT: full
          GH_TOKEN: ${{ github.token }}
        run: ./"${MODEL^^}"/build.sh
      - name: Build firmware without frontend resources
        id: slim
        if: ${{ !cancelled() && steps.prep.outcome == 'success' }}
        env:
          MODEL: ${{ matrix.model }}
          PHICOMM_FIRMWARE_VARIANT: no-frontend-resources
          GH_TOKEN: ${{ github.token }}
        run: ./"${MODEL^^}"/build.sh
      - name: Test TC1 protocol and HTTP regressions
        if: ${{ !cancelled() && matrix.model == 'tc1' && steps.prep.outcome == 'success' && needs.frontend.outputs.reuse-heavy-validation != 'true' }}
        run: |
          bash tools/ci/require_arm_tools.sh
          test -s build/tc1-sdk-3.6.4/mico-os/libraries/utilities/json_c/json_number_reent.h
          tests/run_tc1.sh
      - name: Prepare full release assets
        if: ${{ !cancelled() && steps.full.outcome == 'success' }}
        env:
          MODEL: ${{ matrix.model }}
        run: |
          product="$MODEL"
          if [ "$MODEL" = tc1 ]; then product=tc1_a1; fi
          directory="release/full"
          mkdir -p "$directory"
          cp "build/${MODEL}-release/phicomm_${product}.ota.bin" "$directory/phicomm_${product}.ota.bin.raw"
          cp "build/${MODEL}-release/phicomm_${product}.all.bin" "$directory/"
          (cd "$directory" && sha256sum *.bin *.bin.raw > "SHA256SUMS-${MODEL}")
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.full.outcome == 'success' }}
        with:
          name: ${{ matrix.model }}-full-firmware
          path: release/full/
          if-no-files-found: error
          retention-days: 30
      - name: Build and collect A1 fresh-air variants
        if: matrix.model == 'a1'
        run: |
          for variant in fresh-air fresh-air-no-frontend-resources; do
            PHICOMM_FIRMWARE_VARIANT="$variant" ./A1/build.sh
            directory="release/$variant"
            mkdir -p "$directory"
            cp "build/a1-$variant-release/phicomm_a1-$variant.ota.bin" "$directory/phicomm_a1-$variant.ota.bin.raw"
            cp "build/a1-$variant-release/phicomm_a1-$variant.all.bin" "$directory/"
          done
      - uses: actions/upload-artifact@v4
        if: matrix.model == 'a1'
        with:
          name: a1-fresh-air-firmware
          path: release/fresh-air/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.model == 'a1'
        with:
          name: a1-fresh-air-no-frontend-resources-firmware
          path: release/fresh-air-no-frontend-resources/
          if-no-files-found: error
      - name: Prepare no-frontend-resources release assets
        if: ${{ !cancelled() && steps.slim.outcome == 'success' }}
        env:
          MODEL: ${{ matrix.model }}
        run: |
          product="$MODEL"
          if [ "$MODEL" = tc1 ]; then product=tc1_a1; fi
          directory="release/no-frontend-resources"
          mkdir -p "$directory"
          cp "build/${MODEL}-no-frontend-resources-release/phicomm_${product}-no-frontend-resources.ota.bin" "$directory/phicomm_${product}-no-frontend-resources.ota.bin.raw"
          cp "build/${MODEL}-no-frontend-resources-release/phicomm_${product}-no-frontend-resources.all.bin" "$directory/"
          (cd "$directory" && sha256sum *.bin *.bin.raw > "SHA256SUMS-${MODEL}-no-frontend-resources")
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.slim.outcome == 'success' }}
        with:
          name: ${{ matrix.model }}-no-frontend-resources-firmware
          path: release/no-frontend-resources/
          if-no-files-found: error
          retention-days: 30

  esp:
    name: DAIKIN ESP32 ${{ matrix.variant }} firmware
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        variant: [full, hub]
    env:
      PHICOMM_FIRMWARE_VARIANT: ${{ matrix.variant }}
    runs-on: >-
      ${{ fromJSON(
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
        ((github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted') ||
         (vars.PHICOMM_CI_RUNNER == 'self-hosted' &&
          (github.event_name != 'workflow_dispatch' || inputs.runner == 'auto'))) &&
        '["self-hosted","linux","x64","phicomm-build"]' || '["ubuntu-22.04"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: verified-frontend
          path: build/ci-frontend/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            DAIKIN/.pio/libdeps
          key: esp32-${{ runner.os }}-${{ hashFiles('DAIKIN/platformio.ini') }}
      - name: Install ESP and host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev
          python3 -m pip install platformio==6.2.0 cryptography==46.0.3 -r requirements-build.txt
      - name: Build universal image and enforce stock OTA resource budgets
        env:
          PHICOMM_FRONTEND_ARCHIVE: ${{ github.workspace }}/build/ci-frontend/frontend.tar.gz
        run: |
          DAIKIN/build.sh
          python3 tools/release/check_esp_budget.py --variant "$PHICOMM_FIRMWARE_VARIANT" --layout stock \
            --output "release/budget-daikin-$PHICOMM_FIRMWARE_VARIANT.json"
      - name: Preserve measured budgets on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daikin-${{ matrix.variant }}-failed-budget
          path: release/budget-daikin-${{ matrix.variant }}.json
          if-no-files-found: ignore
      - name: Test actual OTA handler, MessagePack wire and device sessions
        run: |
          python3 -m unittest discover -s DAIKIN/tests -p 'test_ota_identity.py'
          python3 -m unittest discover -s DAIKIN/tests -p 'test_wire_msgpack.py'
          python3 -m unittest discover -s DAIKIN/tests -p 'test_web_auth.py'
          python3 -m unittest discover -s DAIKIN/tests -p 'test_lan_pairing.py'
          python3 -m unittest discover -s DAIKIN/tests -p 'test_auth_storage.py'
          python3 -m unittest discover -s DAIKIN/tests -p 'test_hub_mixed_devices.py'
      - name: Test ESP32 protocol and actual embedded page
        if: matrix.variant == 'full'
        run: |
          c++ -std=c++11 -Wall -Wextra -Werror -IDAIKIN/include DAIKIN/tests/frames.cpp -o build/daikin-frames
          build/daikin-frames
          c++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -IDAIKIN/include DAIKIN/tests/cm1106.cpp -o build/daikin-cm1106
          ASAN_OPTIONS=detect_leaks=1 build/daikin-cm1106
          c++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined -IDAIKIN/include DAIKIN/tests/climate.cpp -o build/daikin-climate
          build/daikin-climate
          c++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -IDAIKIN/include -IDAIKIN/.pio/libdeps/bry88ab/ArduinoJson/src DAIKIN/tests/indicators.cpp -o build/daikin-indicators
          ASAN_OPTIONS=detect_leaks=1 build/daikin-indicators
          c++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -IDAIKIN/include -IDAIKIN/.pio/libdeps/bry88ab/ArduinoJson/src DAIKIN/tests/indicator_runtime.cpp -o build/daikin-indicator-runtime
          ASAN_OPTIONS=detect_leaks=1 build/daikin-indicator-runtime
          npm install --prefix build/esp-tests --no-save jsdom@26.1.0
          NODE_PATH=build/esp-tests/node_modules node DAIKIN/tests/web.cjs
      - name: Check out pinned ESP-IDF NVS host-test sources
        if: matrix.variant == 'hub' && needs.frontend.outputs.reuse-heavy-validation != 'true'
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-idf
          ref: 38eeba213aa695aabfd6d89aa9f5078dbe5a94c3
          path: build/esp-idf-nvs
          persist-credentials: false
          sparse-checkout: |
            components/nvs_flash
            components/esp_rom/include
            components/esp_rom/linux
            components/esp_common/include
            components/log/include
      - name: Test hub UDP, device bus and bounded storage
        if: matrix.variant == 'hub' && needs.frontend.outputs.reuse-heavy-validation != 'true'
        env:
          DAIKIN_NVS_IDF_SOURCE: ${{ github.workspace }}/build/esp-idf-nvs
        run: |
          SANITIZE=1 python3 -m unittest discover -s DAIKIN/tests -p 'test_hub*.py'
          # Explicit modules prevent a missing UDP lane from passing an empty glob.
          SANITIZE=1 python3 -m unittest DAIKIN.tests.test_hub_lan_client DAIKIN.tests.test_hub_lan_home DAIKIN.tests.test_hub_lan_discovery
          python3 -m unittest discover -s DAIKIN/tests -p 'test_native_publish.py'
          python3 -m unittest DAIKIN.tests.test_lan_business
          for scenario in home http relay service storage; do
            c++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined \
              -fno-omit-frame-pointer -fno-pie -no-pie -IDAIKIN/include \
              -IDAIKIN/.pio/libdeps/bry88ab-hub/ArduinoJson/src \
              "DAIKIN/tests/hub/$scenario.cpp" -lcrypto -o "build/daikin-hub-$scenario"
            ASAN_OPTIONS=detect_leaks=1 "build/daikin-hub-$scenario"
          done
      - name: Test production HAP value handling and byte output
        if: matrix.variant == 'hub' && needs.frontend.outputs.reuse-heavy-validation != 'true'
        run: |
          python3 -m unittest discover -s DAIKIN/tests -p 'test_hap*.py'
          python3 DAIKIN/tests/test_frontend_prepare.py
      - name: Identify exact frontend source for hub integration tests
        if: matrix.variant == 'hub' && needs.frontend.outputs.reuse-heavy-validation != 'true'
        id: hub-frontend
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          sys.path.insert(0, 'tools')
          from frontend_release import read_lock
          lock = read_lock('frontend.lock.json')
          print(f"repository={lock['repository']}")
          print(f"commit={lock['commit']}")
          PY
      - uses: actions/checkout@v4
        if: matrix.variant == 'hub' && needs.frontend.outputs.reuse-heavy-validation != 'true'
        with:
          repository: ${{ steps.hub-frontend.outputs.repository }}
          ref: ${{ steps.hub-frontend.outputs.commit }}
          path: build/hub-frontend-source
          persist-credentials: false
      - name: Test locked hub LAN management frontend
        if: matrix.variant == 'hub' && needs.frontend.outputs.reuse-heavy-validation != 'true'
        env:
          FIRMWARE_ROOT: ${{ github.workspace }}
          HUB_TEST_DIST: ${{ github.workspace }}/build/hub-ci-dist
          VITE_HUB: '1'
          VITE_BASE_PATH: /iotcloud/
        working-directory: build/hub-frontend-source/frontend
        run: |
          test -f tests/hub-lan-management.mjs
          npm ci
          npx playwright install --with-deps chromium
          npm run build -- --outDir "$HUB_TEST_DIST" --emptyOutDir
          # Browser API fixtures cover management UX; production UDP and HAP
          # business paths run separately above, not through a simulated broker.
          node tests/hub-lan-management.mjs
      - name: Collect ESP release assets
        run: |
          mkdir -p release
          stem="$(python3 tools/release/products.py daikin "$PHICOMM_FIRMWARE_VARIANT")"
          directory=build/daikin-release
          if [ "$PHICOMM_FIRMWARE_VARIANT" != full ]; then directory="build/daikin-$PHICOMM_FIRMWARE_VARIANT-release"; fi
          cp "$directory/$stem.all.bin" release/
          cp "$directory/$stem.ota.bin" "release/$stem.ota.bin.raw"
          cp "$directory/manifest.json" "release/manifest-daikin-$PHICOMM_FIRMWARE_VARIANT.json"
          (cd release && sha256sum * > "SHA256SUMS-daikin-$PHICOMM_FIRMWARE_VARIANT")
      - uses: actions/upload-artifact@v4
        with:
          name: daikin-${{ matrix.variant }}-firmware
          path: release/
          if-no-files-found: error
          retention-days: 30

  sign-ota:
    name: Sign production OTA packages
    needs: [firmware, esp, validation-evidence]
    if: >-
      always() && needs.validation-evidence.result == 'success' &&
      ((github.event_name == 'push' && github.ref_type == 'tag') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_dry_run))
    runs-on: >-
      ${{ fromJSON(
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
        ((github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted') ||
         (vars.PHICOMM_CI_RUNNER == 'self-hosted' &&
          (github.event_name != 'workflow_dispatch' || inputs.runner == 'auto'))) &&
        '["self-hosted","linux","x64","phicomm-build"]' || '["ubuntu-22.04"]') }}
    environment: signed-ota-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify approved release source
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 tools/check_branch_policy.py
          if [ "$TAG_NAME" = main ]; then
            python3 tools/check_version.py
          else
            python3 tools/check_version.py --tag "$TAG_NAME"
          fi
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-firmware'
          merge-multiple: true
          path: release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography==46.0.3
      - name: Require GitHub CLI for signed release reuse
        run: bash tools/ci/ensure_gh.sh
      - name: Sign and verify production packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OTA_KEY: ${{ secrets.OTA_SIGNING_KEY_PEM }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          test -n "$OTA_KEY"
          umask 077
          key_file="$RUNNER_TEMP/phicomm-ota-key.pem"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$OTA_KEY" > "$key_file"
          unset OTA_KEY
          if [ "$TAG_NAME" != main ] && gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release download "$TAG_NAME" --pattern "*.signed" --dir previous
          fi
          if [ "$TAG_NAME" = main ]; then TAG_NAME="v$(cat VERSION)"; fi
          python3 tools/release/products.py --targets > "$RUNNER_TEMP/release-targets.txt"
          while read -r model variant; do
            stem="$(python3 tools/release/products.py "$model" "$variant")"
            if test -s "previous/$stem.ota.bin.signed"; then
              cp "previous/$stem.ota.bin.signed" release/
              tail -c +193 "release/$stem.ota.bin.signed" | cmp - "release/$stem.ota.bin.raw"
            else
              python3 tools/ota/package.py --key "$key_file" --model "$model" \
                --version "$TAG_NAME" --commit "$(git rev-parse HEAD)" \
                "release/$stem.ota.bin.raw" "release/$stem.ota.bin.signed"
            fi
            python3 tools/release/verify.py "release/$stem.ota.bin.signed" "$model" "$TAG_NAME" "$(git rev-parse HEAD)" --variant "$variant"
          done < "$RUNNER_TEMP/release-targets.txt"
          (cd release && sha256sum *.bin *.bin.raw *.bin.signed > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Validate complete release catalog
        if: github.event_name == 'workflow_dispatch' && inputs.release_dry_run
        run: |
          tag="v$(cat VERSION)"
          printf '%s\n' 'Release validation only; not published.' > release-dry-run.md
          python3 tools/release/catalog.py "$tag" "$(git rev-parse HEAD)" release release-dry-run.md
          (cd release && sha256sum *.bin *.bin.raw *.bin.signed *.json *.msgpack notes.md index.html > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: release/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish OTA and Pages
    needs: [sign-ota]
    # Heavy validation reuse skips an ancestor; require successful signing explicitly.
    if: >-
      always() && needs.sign-ota.result == 'success' &&
      github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: >-
      ${{ fromJSON(
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
        ((github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted') ||
         (vars.PHICOMM_CI_RUNNER == 'self-hosted' &&
          (github.event_name != 'workflow_dispatch' || inputs.runner == 'auto'))) &&
        '["self-hosted","linux","x64","phicomm-build"]' || '["ubuntu-22.04"]') }}
    environment: signed-ota-production
    concurrency:
      group: production-ota-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: signed-release
          path: release
      - run: pip install cryptography==46.0.3
      - name: Require GitHub CLI for publication
        run: bash tools/ci/ensure_gh.sh
      - name: Classify the strictly validated release tag
        id: release-channel
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          channel="$(python3 tools/release/release_version.py "$TAG_NAME")"
          printf 'channel=%s\n' "$channel" >> "$GITHUB_OUTPUT"
      - name: Extract frozen Wiki release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 tools/release/notes.py "$TAG_NAME" --output release-notes.md
          python3 tools/release/catalog.py "$TAG_NAME" "$GITHUB_SHA" release release-notes.md
          (cd release && sha256sum -c SHA256SUMS)
          (cd release && sha256sum *.bin *.bin.raw *.bin.signed *.json *.msgpack notes.md index.html > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Verify reviewed notes against staged signed firmware
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ steps.release-channel.outputs.channel }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          gh repo clone phicomm-io/phicomm-io.github.io "$RUNNER_TEMP/retained-notes-archive" -- --depth=1
          if [ "$RELEASE_CHANNEL" = candidate ]; then
            python3 tools/release/archive_pages.py "$RUNNER_TEMP/retained-notes-archive" --include-candidates --candidates-r2
          fi
          python3 tools/release/verify_user_notes_release.py release "$RUNNER_TEMP/retained-notes-archive"
      - name: Stage GitHub release and immutable OTA assets
        if: steps.release-channel.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --draft --title "$TAG_NAME" --notes-file release-notes.md release/*
          else
            gh release download "$TAG_NAME" --dir existing
            for file in release/*.bin* release/SHA256SUMS; do cmp "$file" "existing/$(basename "$file")"; done
          fi
          python3 tools/release/deploy_worker.py
          python3 tools/release/publish.py release
          gh release edit "$TAG_NAME" --draft=false --latest
          python3 tools/release/publish.py release --promote
      - name: Publish an isolated GitHub prerelease and candidate catalog
        if: steps.release-channel.outputs.channel == 'candidate'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --draft --prerelease --latest=false --title "$TAG_NAME" --notes-file release-notes.md release/*
          else
            gh release download "$TAG_NAME" --dir existing
            for file in release/*.bin* release/SHA256SUMS; do cmp "$file" "existing/$(basename "$file")"; done
          fi
          python3 tools/release/publish.py release
          gh release edit "$TAG_NAME" --draft=false --prerelease --latest=false
          python3 tools/release/publish.py release --candidate
      - uses: actions/setup-node@v4
        if: steps.release-channel.outputs.channel == 'stable'
        with:
          node-version: '24'
      - name: Build and publish public Pages allowlist
        if: steps.release-channel.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: tools/release/pages.sh

  release-checks:
    name: Lightweight release checks
    needs: [frontend, firmware]
    runs-on: >-
      ${{ fromJSON(
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
        ((github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted') ||
         (vars.PHICOMM_CI_RUNNER == 'self-hosted' &&
          (github.event_name != 'workflow_dispatch' || inputs.runner == 'auto'))) &&
        '["self-hosted","linux","x64","phicomm-build"]' || '["ubuntu-22.04"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install release check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev openssl
          python3 -m pip install cryptography==46.0.3
      - uses: actions/cache@v4
        with:
          path: build/mico-upstream.git
          key: mico-bare-${{ hashFiles('common/mico-sdk.json') }}
      - name: Prepare pinned JSON and SHA sources for actual OTA checks
        run: python3 tools/prepare_sdk.py build/a1-sdk/mico-os
      - uses: actions/download-artifact@v4
        with:
          name: tc1-full-firmware
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: a1-full-firmware
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: m1-full-firmware
          path: release
      - name: Test signed OTA vectors and Flash faults
        env:
          TC1_TEST_IMAGE: release/phicomm_tc1_a1.ota.bin.raw
          A1_TEST_IMAGE: release/phicomm_a1.ota.bin.raw
          M1_TEST_IMAGE: release/phicomm_m1.ota.bin.raw
        run: |
          test -s "$TC1_TEST_IMAGE"
          test -s "$A1_TEST_IMAGE"
          test -s "$M1_TEST_IMAGE"
          tests/ota/run.sh
      - name: Test OTA release tooling and Worker
        run: |
          python3 -m unittest discover -s tests -p test_release.py
          python3 -m unittest tests.test_version tests.test_branch_policy tests.test_release_budget tests.test_release_variant tests.test_release_publish tests.test_device_manifest tests.test_release_candidate tests.test_archive_pages tests.test_ci_validation_reuse
          node --test tests/test_ota_worker.mjs
      - name: Test production TLS transport with real TLS and sanitizers
        run: python3 tests/test_ota_fetch.py

  feature-tests:
    env:
      ARM_CC: ${{ github.workspace }}/build/ci-tools/gcc-arm-none-eabi-5_4-2016q2/bin/arm-none-eabi-gcc
      PHICOMM_OTA_CN_BASE_URL: ""
      PHICOMM_OTA_GLOBAL_BASE_URL: ""
      PHICOMM_FRONTEND_ARCHIVE: ${{ github.workspace }}/build/ci-frontend/frontend.tar.gz
    name: Binding and automation host scenarios
    needs: [frontend, firmware]
    if: needs.frontend.outputs.reuse-heavy-validation != 'true'
    runs-on: >-
      ${{ fromJSON(
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
        ((github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted') ||
         (vars.PHICOMM_CI_RUNNER == 'self-hosted' &&
          (github.event_name != 'workflow_dispatch' || inputs.runner == 'auto'))) &&
        '["self-hosted","linux","x64","phicomm-build"]' || '["ubuntu-22.04"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: verified-frontend
          path: build/ci-frontend/
      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev openssl python3-pip curl git qemu-user libc6-i386 bzip2 libncurses5 libtinfo5
      - name: Identify tool cache location
        id: tool-path
        run: echo "key=$(printf '%s' "$GITHUB_WORKSPACE" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: build/mico-upstream.git
          key: mico-bare-${{ hashFiles('common/mico-sdk.json') }}
      - uses: actions/cache@v4
        with:
          path: |
            build/ci-tools/gcc-arm-none-eabi-5_4-2016q2
            build/ci-tools/python2
          key: ci-tools-ubuntu22-${{ runner.arch }}-gcc541-python2718-v1-${{ steps.tool-path.outputs.key }}
      - name: Require pinned ARM host test tools
        run: |
          bash tools/ci/check_cached_tools.sh
          if [ ! -x "$ARM_CC" ]; then
            mkdir -p build/ci-tools
            curl -fsSL --retry 3 'https://launchpad.net/gcc-arm-embedded/5.0/5-2016-q2-update/+download/gcc-arm-none-eabi-5_4-2016q2-20160622-linux.tar.bz2' -o "$RUNNER_TEMP/gcc.tar.bz2"
            echo "9910b6b5df12efe564dbb3856bf1599d4c16178a6f28bd8a23c9e5c3edc219e4  $RUNNER_TEMP/gcc.tar.bz2" | sha256sum -c -
            tar -xjf "$RUNNER_TEMP/gcc.tar.bz2" -C build/ci-tools
          fi
          bash tools/ci/require_arm_tools.sh
      - name: Prepare all pinned SDKs for early ARM and JSON tests
        run: |
          for sdk in a1-sdk m1-sdk tc1-sdk-3.6.4; do
            python3 tools/prepare_sdk.py "build/$sdk/mico-os"
            test -s "build/$sdk/mico-os/include/mico.h"
          done
          # Main still tests the legacy TC1 HTTP SDK overlays directly.
          # Shared-HTTP builds no longer apply this legacy patch family.
          if grep -Fq '"$app_dir/http-connection-sdk.patch"' TC1/build.sh; then
            python3 tools/apply_sdk_patch.py build/tc1-sdk-3.6.4/mico-os \
              TC1/http-connection-sdk.patch TC1/http-resource-sdk.patch \
              TC1/http-client-limit-sdk.patch TC1/http-auth-sdk.patch \
              TC1/http-cors-sdk.patch TC1/http-cors-empty-sdk.patch \
              TC1/http-options-sdk.patch TC1/http-client-once-sdk.patch \
              TC1/http-recovery-sdk.patch
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test engines, binding runtime and WebUI syntax
        run: |
          python3 -m pip install Markdown==3.7 Jinja2==3.1.6 cryptography==46.0.3 -r requirements-build.txt
          tests/run.sh
      - name: Prepare pinned SDKs for MQTT transport tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sdk in a1-sdk m1-sdk tc1-sdk-3.6.4; do
            python3 tools/prepare_sdk.py "build/$sdk/mico-os"
          done
          # build_host.sh owns the complete ordered MQTT stack. Pre-applying
          # only selected overlays creates an incompatible non-prefix state.
          python3 -m unittest tests.test_mqtt_overlay_preparation tests.test_mqtt_subscribe_qos tests.test_easylink_bonjour
      - name: Test TMCP using real SDK workers and an isolated broker
        run: |
          python3 -m pip install paho-mqtt==2.1.0 Jinja2==3.1.6
          tests/build_host.sh
          tests/run_mqtt_v2.sh
      - name: Test local LAN codec and client lifecycle
        run: SANITIZE=1 python3 -m unittest tests.test_lan_wire tests.test_lan_client

  validation-evidence:
    name: Validate complete test evidence
    needs: [frontend, firmware, esp, release-checks, feature-tests]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require all builds and current or reusable tests
        env:
          VALIDATION_NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci/validation_reuse.py gate
      - name: Record complete main source validation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VALIDATION_NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci/validation_reuse.py create --output build/full-validation/validation.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: full-validation-evidence
          path: build/full-validation/validation.json
          if-no-files-found: error
          retention-days: 30
