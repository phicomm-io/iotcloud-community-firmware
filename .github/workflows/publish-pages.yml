name: Publish static site

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: >-
      ${{ fromJSON(vars.PHICOMM_CI_RUNNER == 'self-hosted' &&
        '["self-hosted","linux","x64","phicomm-build"]' || '["ubuntu-22.04"]') }}
    environment: signed-ota-production
    concurrency:
      group: production-ota-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require GitHub CLI for publication
        run: bash tools/ci/ensure_gh.sh
      - name: Verify mirror request headers
        run: |
          python3 -m pip install cryptography==46.0.3
          python3 tests/test_publish_user_notes.py
      - name: Prepare published frontend archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/prepare_frontend.py --output "$RUNNER_TEMP/notes-frontend/frontend.tar.gz"
      - name: Publish verified archive and static pages
        env:
          GH_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PHICOMM_FRONTEND_ARCHIVE: ${{ runner.temp }}/notes-frontend/frontend.tar.gz
        run: tools/release/pages.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-static-site
          path: build/pages
          if-no-files-found: ignore
