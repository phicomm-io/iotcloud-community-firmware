name: Test TMCP platform
on:
  pull_request:
    paths: ['platform/**', 'common/web/style.css', '.github/workflows/platform.yml']
  push:
    branches: [main]
    paths: ['platform/**', 'common/web/style.css', '.github/workflows/platform.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platform:
    name: Platform host and browser tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: platform/backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - name: Test account migrations and service
        run: cd platform/backend && go test ./...
      - name: Test protocol and frontend build
        run: cd platform/frontend && npm ci && npm test && npm run build && npx playwright install --with-deps chromium
      - name: Verify shared design tokens
        run: python3 platform/scripts/sync-design.py && git diff --exit-code -- platform/frontend/src/device-tokens.css
      - name: Test real Broker migration and persistence
        run: platform/scripts/test-integration.sh
      - name: Test isolated Broker and browser flows
        run: platform/scripts/test-browser-compose.sh
