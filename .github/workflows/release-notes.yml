name: Static release notes
on:
  push:
    branches: [main, dev, 'feature/**', 'hotfix/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        default: auto
        options: [auto, github-hosted, self-hosted]
permissions:
  contents: read
env:
  PHICOMM_FRONTEND_ARCHIVE: ${{ github.workspace }}/build/ci-frontend/frontend.tar.gz
jobs:
  static-notes:
    runs-on: >-
      ${{ fromJSON(
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
        ((github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted') ||
         (vars.PHICOMM_CI_RUNNER == 'self-hosted' &&
          (github.event_name != 'workflow_dispatch' || inputs.runner == 'auto'))) &&
        '["self-hosted","linux","x64","phicomm-build"]' || '["ubuntu-22.04"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check branch workflow
        run: python3 tools/check_branch_policy.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python3 -m pip install Markdown==3.7 cryptography==46.0.3
      - run: npm ci --ignore-scripts
      - name: Prepare exact frontend archive
        env:
          # Match firmware CI: main, tags and fork PRs require the release asset.
          ALLOW_CANDIDATE_SOURCE: >-
            ${{ github.ref_type != 'tag' &&
                ((github.event_name == 'pull_request' &&
                  github.event.pull_request.head.repo.full_name == github.repository) ||
                 (github.event_name == 'workflow_dispatch' && github.ref_name != 'main')) }}
        run: |
          args=()
          if [ "$ALLOW_CANDIDATE_SOURCE" = true ]; then args+=(--allow-candidate-source); fi
          python3 tools/ci/prepare_frontend.py \
            --output "$PHICOMM_FRONTEND_ARCHIVE" "${args[@]}"
      - name: Migration, scope, lifecycle and browser request tests
        run: |
          python3 tests/test_user_notes.py
          python3 tests/test_site_docs.py
          python3 -m unittest tests.test_archive_pages tests.test_release_candidate
          python3 tests/test_publish_user_notes.py
          node --test tests/test_release_notes.cjs tests/test_release_notes_web.cjs
          node --test tests/test_ota_worker.mjs
      - name: Build the fixed historical snapshot
        run: python3 site/build.py build/pages
      - name: Browser and no-JavaScript history
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.64.1
          npx playwright install --with-deps chromium
          python3 -m http.server 18765 --bind 127.0.0.1 --directory build/pages > "$RUNNER_TEMP/notes-http.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          node tests/test_release_notes_browser.cjs
          PHICOMM_RC_BROWSERS=chromium node tests/test_release_candidate_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-release-notes
          path: |
            build/pages
            build/notes-evidence
            build/rc-ui-evidence
            build/ci-frontend/frontend.lock.json
            build/ci-frontend/provenance.json
