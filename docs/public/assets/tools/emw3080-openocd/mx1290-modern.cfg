# MX1290 SWD / OpenOCD 0.11 and 0.12.
# Reset register values and RAM base follow MXCHIP's MX1290/core.cfg.
# Flash programming is performed by the separately supplied flash_prog.elf.
adapter driver jlink
transport select swd
adapter speed 1000
adapter srst delay 100
source [find target/swj-dp.tcl]
set CHIP_RAM_START 0x10005000
swj_newdap MX1290 cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x4ba00477
dap create MX1290.dap -chain-position MX1290.cpu
target create MX1290.cpu cortex_m -endian little -dap MX1290.dap
MX1290.cpu configure -work-area-phys $CHIP_RAM_START -work-area-size 0x4000 -work-area-backup 0
MX1290.cpu configure -event reset-end {
    mww 0x40000210 0x00010113
    mww 0x40000214 0x00000000
}
reset_config none separate
cortex_m reset_config vectreset
