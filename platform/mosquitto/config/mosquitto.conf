per_listener_settings false
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/security/dynamic-security.json
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
listener 1883 0.0.0.0
listener 9001 0.0.0.0
protocol websockets
# Internal, verified TLS connection for backend management and login checks.
listener 8883 0.0.0.0
certfile /mosquitto/security/certs/server.crt
keyfile /mosquitto/security/certs/server.key
