<form id="mqttForm"><label for="mqttMode">主题模式</label><select id="mqttMode"><option value="legacy">legacy（原主题）</option><option value="account">account（社区平台）</option></select><p class="hint">legacy 需在平台手动绑定；account 上线后自动加入云端列表。切换账户或模式会尝试清理旧 HA 实体。失败时需在旧 Broker 手动清理。</p><label for="mqttHost">Broker 地址</label><input id="mqttHost" maxlength="{{mqtt_host_max}}" placeholder="IP 或域名；留空停用"><label for="mqttPort">端口</label><input id="mqttPort" type="number" min="1" max="65535" value="1883" required><label for="mqttUser">用户名</label><input id="mqttUser" maxlength="63" autocomplete="off"><label for="mqttPassword">密码</label><input id="mqttPassword" type="password" maxlength="256" autocomplete="new-password" placeholder="留空保留原密码"><label><input id="clearMqttPassword" type="checkbox"> 清除已保存的 MQTT 密码</label><button>保存 MQTT 设置</button></form>
