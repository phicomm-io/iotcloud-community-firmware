<form id="wifiForm"><label for="ssid">网络名称</label><div class="row"><input id="ssid" maxlength="32" required autocomplete="off"><button id="scan" type="button">扫描</button></div><select id="networks" aria-label="扫描到的网络" hidden></select><label for="wifiPassword">密码</label><input id="wifiPassword" type="password" maxlength="63" autocomplete="new-password" placeholder="同一网络留空保留原密码"><label><input id="openNetwork" type="checkbox"> 此网络没有密码</label><button>保存并连接</button></form>
